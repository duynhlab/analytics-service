name: Check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Compile deferred Linux integration suite
        run: go test -tags=integration -run '^$' ./...
      - name: Install pinned linter with the selected Go compiler
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: golangci-lint run ./...
